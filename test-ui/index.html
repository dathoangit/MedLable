<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedLabel — Lookup test</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>MedLabel</h1>
        <p class="subtitle">Test tra cứu mã hồ sơ / mã bệnh án (local)</p>
      </header>

      <section class="card">
        <form id="lookup-form">
          <label class="label" for="code-input">Mã hồ sơ hoặc mã bệnh án</label>
          <div class="row">
            <input
              id="code-input"
              name="code"
              type="text"
              inputmode="text"
              maxlength="64"
              placeholder="2609230012 hoặc 2641600"
              autocomplete="off"
              required
            />
            <button id="submit-btn" type="submit">Tra cứu</button>
          </div>
          <p id="hint" class="hint">
            Tự nhận: 10 số YYMMDD+STT → mã hồ sơ; còn lại → mã bệnh án.
          </p>
        </form>
        <p id="status" class="status" hidden></p>
      </section>

      <section id="patient-card" class="card" hidden>
        <h2>Người bệnh</h2>
        <dl id="patient-dl" class="kv"></dl>
      </section>

      <section id="orders-card" class="card" hidden>
        <h2>
          Phiếu điều trị
          <span id="orders-count" class="badge"></span>
          <span id="meds-total" class="badge muted"></span>
        </h2>
        <p class="hint">
          Mỗi phiếu có nút <strong>In tem</strong> — chỉ mở tem thuốc tiêm
          thuần (bỏ uống / truyền). Giấy cuộn 2 ô 50×20 mm mỗi hàng, ô lẻ để
          trống.
        </p>
        <div id="orders-list" class="orders-list"></div>
      </section>
    </main>

    <dialog id="tem-dialog" class="tem-dialog">
      <div class="tem-dialog-bar">
        <h2 id="tem-dialog-title">Tem thuốc tiêm</h2>
        <div class="tem-dialog-actions">
          <button type="button" id="tem-print-all" class="btn-print">
            In cả phiếu
          </button>
          <form method="dialog">
            <button type="submit" class="btn-secondary" value="close">
              Đóng
            </button>
          </form>
        </div>
      </div>
      <p id="tem-dialog-hint" class="hint"></p>
      <div id="tem-dialog-list" class="labels-list"></div>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
